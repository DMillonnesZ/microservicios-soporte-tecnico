# ============================================================
#  tecnico-service  |  Puerto 8082  |  BD: bd_tecnico  (MariaDB)
#  Perfil por defecto: dev  (cambiar con SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring:
  application:
    name: tecnico-service
  config:
    import: optional:file:.env[.properties],optional:file:tecnico-service/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver

server:
  port: 8082

---
# ------------------------- DEV -------------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/bd_tecnico?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.tecsup: DEBUG

---
# ------------------------- PROD ------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/bd_tecnico}
    username: ${DB_USERNAME:soporte_app}
    password: ${DB_PASSWORD:cambiar_clave}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    com.tecsup: INFO