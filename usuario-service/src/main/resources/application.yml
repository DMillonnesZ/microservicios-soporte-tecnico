# ============================================================
#  usuario-service  |  Puerto 8081  |  BD: bd_usuario  (MariaDB)
#  Perfil por defecto: dev  (cambiar con SPRING_PROFILES_ACTIVE=prod)
# ============================================================
spring:
  application:
    name: usuario-service
  config:
    # Busca el .env en la carpeta del servicio o desde la raiz del proyecto
    import: optional:file:.env[.properties],optional:file:usuario-service/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_USERNAME:}
  verificacion:
    minutos-expiracion: 10

server:
  port: 8081

---
# ------------------------- DEV -------------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/bd_usuario?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  mail:
    # true = envia correo real | false = muestra el codigo en consola
    enabled: ${MAIL_ENABLED:true}

logging:
  level:
    com.tecsup: DEBUG

---
# ------------------------- PROD ------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/bd_usuario}
    username: ${DB_USERNAME:soporte_app}
    password: ${DB_PASSWORD:cambiar_clave}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false

app:
  mail:
    enabled: ${MAIL_ENABLED:true}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    com.tecsup: INFO